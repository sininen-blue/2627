<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Question number selector</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; }
    td, th { border: 1px solid #ccc; padding: 0.4rem 0.7rem; text-align: left; }
    tr.selected { background: #e7f8ff; }
  </style>
</head>
<body>
  <h1>Questions</h1>
  <p>Example markup only. Each row has a checkbox and a number cell. The script checks the number cell, not the checkbox value.</p>
  <table id="questions">
    <thead>
      <tr><th></th><th>#</th><th>Question</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <script>
    const tbody = document.querySelector("#questions tbody");
    for (let n = 1; n <= 70; n++) {
      const row = document.createElement("tr");
      row.innerHTML = `<td><input type="checkbox" name="question[]" value="${1000 + n}"></td><td>${n}</td><td>Question ${n}</td>`;
      row.querySelector("input").addEventListener("change", () => {
        row.classList.toggle("selected", row.querySelector("input").checked);
      });
      tbody.appendChild(row);
    }
  </script>
  <script src="remover.js"></script>
</body>
</html>
